# SPDX-License-Identifier: AGPL-3.0-only
# Release: tag `v*` → per-OS `cargo tauri build` via tauri-action, bundles
# attached to a DRAFT GitHub Release (review, then publish manually).
#
# Secrets live on the `release` ENVIRONMENT (repo Settings → Environments →
# New environment → `release` → "Environment secrets" → Add secret), NOT as
# plain repository secrets — so only this job (tag builds) can ever read
# them, and you can additionally require reviewers / restrict to tags.
# All secrets are optional until the matching feature is enabled — the build
# works without them:
#   PRISM_MSA_CLIENT_ID               Azure client-ID baked into release
#                                     builds for testing (replace with the
#                                     project's own Entra ID once approved).
#   TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]  updater artifacts (`cargo tauri
#                                     signer generate`; enable `updater` in
#                                     tauri.conf.json first — see README).
#   APPLE_CERTIFICATE[_PASSWORD], APPLE_SIGNING_IDENTITY, APPLE_ID,
#   APPLE_PASSWORD, APPLE_TEAM_ID     macOS signing + notarization.
# Windows code signing: add your cert as environment secrets and extend the
# tauri-action step per https://v2.tauri.app/distribute/sign/windows/.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # Gate every secret below behind the `release` environment: tag builds
    # only, optionally with required reviewers (environment settings).
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage,rpm
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit stack
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Testing client-ID from the `release` environment (see header).
          # Unset → placeholder build that refuses login with a clear
          # message instead of a cryptic 403.
          PRISM_MSA_CLIENT_ID: ${{ secrets.PRISM_MSA_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "46Anarchy ${{ github.ref_name }}"
          releaseBody: "See the README for install notes and signing status."
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
