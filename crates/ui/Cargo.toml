# launcher-ui: Tauri v2 backend for the 46Anarchy launcher (vanilla HTML/CSS/JS frontend).

[package]
name = "launcher-ui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tauri v2 backend for the 46Anarchy launcher (invoke commands + shared state; static HTML/CSS/JS frontend)"
authors = ["46Anarchy"]
homepage = "https://46anarchy.fr"
repository = "https://github.com/46anarchy/46anarchy-launcher"

[dependencies]
launcher-core = { path = "../core" }
launcher-auth = { path = "../auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Process liveness for `get_game_status` (same line as launcher-core).
sysinfo = "0.30"
# Same reqwest line as core/auth (shared type for the HTTP client builders).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Tauri WebView shell. Optional so `cargo build` / `cargo test` stay portable
# (no system webkit needed); enable with `--features launcher-ui/tauri-backend`
# (used by the src-tauri harness) for `cargo tauri dev` / `cargo tauri build`.
# NOTE: Tauri v2 has no `api-all` feature (that was v1); default features suffice.
tauri = { version = "2", optional = true }
# Direct per-view WebKit settings (see `tauri_app::apply_webkit_ram_settings`).
# Linux-only + optional (only with `tauri-backend`) so portable builds and
# non-Linux targets link nothing extra. Pinned `=2.0.2` with `v2_38`: exactly
# what wry 0.57 requires (see vendored wry-0.57.0 `Cargo.toml`) — any other
# webkit2gtk would duplicate the `WebView` type and break
# `PlatformWebview::inner()`.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"], optional = true }

[dev-dependencies]
tempfile = "3"

# Build script dependency for `generate_context!` (feature-gated like the
# `tauri_app` module, so plain `cargo build` / `cargo test` stay portable).
# `minifier` + `html-minifier` are pure-Rust, offline-friendly (via cargo
# like everything else, no npm) and only *run* on `PROFILE=release`
# (see `minify_frontend_for_release` in build.rs).
[build-dependencies]
tauri-build = { version = "2", optional = true }
minifier = "=0.3.6"
html-minifier = "=5.0.2"

[features]
default = []
tauri-backend = ["dep:tauri", "dep:tauri-build", "dep:webkit2gtk"]
